syntax = "proto3";
package spire.api.server.credentialacquisition.v1;
option go_package = "github.com/spiffe/spire-api-sdk/proto/spire/api/server/credentialacquisition/v1;credentialacquisitionv1";

import "spire/api/types/credentialacquisition.proto";
import "spire/api/types/x509svid.proto";

// The CredentialAcquisition service is the Credential Acquisition System
// Server of draft-novak-rats-tacra (TACRA) behind the Workload API. An
// Agent, the Credential Acquisition System Client, forwards the three calls
// of a Workload it attested: the Server issues the Freshness Handle,
// appraises the Workload's Evidence through its Verifier, checks the binding
// of the credential key to that Evidence, and, as the Credential Authority,
// mints an X509-SVID for the registration entry, or, as the conduit to the
// Secret Vault, returns the released credential sealed to the Workload's key.
//
// The caller must present an active Agent X509-SVID that is authorized for
// the registration entry named in the request. See the Entry
// GetAuthorizedEntries RPC.
service CredentialAcquisition {
    // Initiates attested credential acquisition for a Target: returns the
    // Freshness Kind and, for present-nonce and present-epoch, the Freshness
    // Handle, with the Credential Acquisition Mode and the algorithms the
    // Credential Authority or the Secret Vault accepts
    // (TACRA, Initiate-Credential-Acquisition).
    rpc InitiateCredentialAcquisition(InitiateCredentialAcquisitionRequest) returns (InitiateCredentialAcquisitionResponse);

    // Enrolls an X509-SVID for the registration entry, for the key of a
    // PKCS#10 CSR the Evidence is bound to (TACRA, Enroll-Credential).
    rpc EnrollCredential(EnrollCredentialRequest) returns (EnrollCredentialResponse);

    // Retrieves a pre-existing credential from the Secret Vault, sealed to
    // the Credential Encryption Key the Evidence is bound to
    // (TACRA, Retrieve-Credential).
    rpc RetrieveCredential(RetrieveCredentialRequest) returns (RetrieveCredentialResponse);
}

message InitiateCredentialAcquisitionRequest {
    // Required. The ID of the registration entry of the Workload the Agent
    // attested, whose credential is acquired.
    string entry_id = 1;

    // Required. The Target: the octet string that names the relying party
    // the credential is for.
    string target = 2;

    // Optional. The Credential Type the Workload plans to use with the
    // Target.
    spire.api.types.CredentialType credential_type = 3;

    // Optional. The Credential Hint.
    string credential_hint = 4;
}

message InitiateCredentialAcquisitionResponse {
    // Required. The mode in which the Target's credential is acquired.
    spire.api.types.CredentialAcquisitionMode mode = 1;

    // Required. The Freshness Kind of this exchange.
    spire.api.types.FreshnessKind freshness_kind = 2;

    // The Freshness Handle: required for present-nonce (16 to 64 octets, at
    // least 128 bits of entropy, issued once) and present-epoch (8 to 64
    // octets), absent otherwise.
    bytes freshness_handle = 3;

    // Optional. Seconds until the Freshness Handle is no longer valid.
    uint32 expires_in = 4;

    // Optional. For absent-timestamp, the maximum age in seconds of
    // Evidence the Verifier accepts.
    uint32 max_age = 5;

    // The signature algorithms the Credential Authority accepts for the
    // Credential Signing Key, as tokens of the TACRA EST profile, for
    // example ecdsa-p256-sha256. Required when mode is enroll.
    repeated string acceptable_csk = 6;

    // The HPKE suites the Secret Vault seals to, each named by its KEM, KDF
    // and AEAD joined with +. Required when mode is retrieve.
    repeated string acceptable_cek = 7;

    // Optional. The Evidence formats accepted, each named by its media
    // type.
    repeated string acceptable_evidence = 8;
}

message EnrollCredentialRequest {
    // Required. The ID of the registration entry named at initiation.
    string entry_id = 1;

    // Required. The Target of the InitiateCredentialAcquisition call.
    string target = 2;

    // Optional. The Credential Type: x509 or wic. A present-nonce exchange
    // that named one at initiation names the same here.
    spire.api.types.CredentialType credential_type = 3;

    // Optional. The Credential Hint, as at initiation.
    string credential_hint = 4;

    // Required. The Freshness Kind the InitiateCredentialAcquisition call
    // returned.
    spire.api.types.FreshnessKind freshness_kind = 5;

    // The freshness element the Evidence binds: the Freshness Handle for
    // present-nonce and present-epoch, the epoch marker the Workload holds
    // for absent-epoch, the Workload's 8-octet timestamp for
    // absent-timestamp, absent for absent-none.
    bytes freshness_element = 6;

    // Required. ASN.1 DER encoded PKCS#10 CSR, signed by the Credential
    // Signing Key the Workload generated. The CSR conveys the public key;
    // the SPIFFE ID comes from the registration entry.
    bytes csr = 7;

    // Required. The Evidence, bound to the CSR, the Target and the freshness
    // element as binding declares.
    bytes evidence = 8;

    // Optional. The media type of evidence.
    string evidence_profile = 9;

    // Required. How the Evidence binds the CSR.
    spire.api.types.EvidenceBinding binding = 10;
}

message EnrollCredentialResponse {
    // Required. The enrolled X509-SVID.
    spire.api.types.X509SVID svid = 1;
}

message RetrieveCredentialRequest {
    // Required. The ID of the registration entry named at initiation.
    string entry_id = 1;

    // Required. The Target of the InitiateCredentialAcquisition call.
    string target = 2;

    // Optional. The Credential Type. A present-nonce exchange that named
    // one at initiation names the same here.
    spire.api.types.CredentialType credential_type = 3;

    // Optional. The Credential Hint, as at initiation.
    string credential_hint = 4;

    // Required. The Freshness Kind the InitiateCredentialAcquisition call
    // returned.
    spire.api.types.FreshnessKind freshness_kind = 5;

    // The freshness element the Evidence binds, as for EnrollCredential.
    bytes freshness_element = 6;

    // Required. The public Credential Encryption Key the Secret Vault seals
    // the credential to, in the encoding of its KEM.
    bytes cek_pub = 7;

    // Required. The Evidence, bound to cek_pub, the Target and the freshness
    // element as binding declares.
    bytes evidence = 8;

    // Optional. The media type of evidence.
    string evidence_profile = 9;

    // Required. How the Evidence binds cek_pub.
    spire.api.types.EvidenceBinding binding = 10;
}

message RetrieveCredentialResponse {
    // Required. The encrypted credential bundle of TACRA (Sealing the
    // Released Credential), opaque to the Server and the agent.
    bytes encrypted_credential_bundle = 1;
}
